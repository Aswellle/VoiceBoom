name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: voiceboom-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.2.23"

jobs:

  # ------------------------------------------------------------
  # 1. Validate version/tag
  # ------------------------------------------------------------
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

          VERSION="${TAG#v}"

          PKG_VERSION=$(node -e \
            "console.log(require('./package.json').version)")

          TAURI_VERSION=$(node -e \
            "console.log(require('./src-tauri/tauri.conf.json').version)")

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "package.json version ($PKG_VERSION) != tag version ($VERSION)"
            exit 1
          fi

          if [[ "$TAURI_VERSION" != "$VERSION" ]]; then
            echo "tauri.conf.json version ($TAURI_VERSION) != tag version ($VERSION)"
            exit 1
          fi

      - name: Ensure tag points to current commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          TAG_SHA=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          HEAD_SHA="$GITHUB_SHA"

          if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
            echo "Tag does not point to workflow commit."
            exit 1
          fi

  # ------------------------------------------------------------
  # 2. Build Windows x64 (installers + portable)
  # ------------------------------------------------------------
  build-windows:
    name: Build Windows x64
    needs: validate

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri installers (MSI + NSIS)
        shell: pwsh
        run: |
          bunx tauri build `
            --target x86_64-pc-windows-msvc `
            --bundles msi,nsis

      - name: Build portable executable
        shell: pwsh
        run: |
          cargo build `
            --manifest-path src-tauri/Cargo.toml `
            --release `
            --target x86_64-pc-windows-msvc

          $exe = "src-tauri/target/x86_64-pc-windows-msvc/release/voiceboom.exe"

          if (-not (Test-Path $exe)) {
            Write-Host "=== EXE INVENTORY ==="
            Get-ChildItem `
              "src-tauri/target" `
              -Filter "*.exe" `
              -Recurse `
              -File |
              ForEach-Object {
                Write-Host $_.FullName
              }
            throw "Portable executable not found: $exe"
          }

          New-Item -ItemType Directory `
            -Force `
            -Path release-artifacts | Out-Null

          Copy-Item `
            $exe `
            "release-artifacts/VoiceBoom-Windows-x64-Portable.exe"

      - name: Collect installers and portable
        shell: pwsh
        run: |
          $dst = "release-artifacts"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          # MSI
          Get-ChildItem `
            "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi" `
            -Filter "*.msi" `
            -File |
            ForEach-Object {
              Copy-Item $_.FullName "$dst/$($_.Name)"
            }

          # NSIS
          Get-ChildItem `
            "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" `
            -Filter "*.exe" `
            -File |
            ForEach-Object {
              Copy-Item $_.FullName "$dst/$($_.Name)"
            }

          # Portable ZIP
          $portableExe = "$dst/VoiceBoom-Windows-x64-Portable.exe"
          if (Test-Path $portableExe) {
            $portableDir = "$env:TEMP/voiceboom-portable"
            if (Test-Path $portableDir) { Remove-Item $portableDir -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $portableExe "$portableDir/VoiceBoom.exe"
            Compress-Archive `
              -Path "$portableDir/*" `
              -DestinationPath "$dst/VoiceBoom-Windows-x64-Portable.zip" `
              -Force
          }

          Get-ChildItem $dst | ForEach-Object {
            Write-Host "$($_.Name)  $($_.Length) bytes"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voiceboom-windows-x64
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------
  # 3. Build macOS ARM64 (native on arm64 runner)
  # ------------------------------------------------------------
  build-macos-arm64:
    name: Build macOS arm64
    needs: validate

    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build macOS arm64
        shell: bash
        run: |
          set -euo pipefail

          bunx tauri build \
            --target aarch64-apple-darwin \
            --bundles app

      - name: Locate and validate app
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"

          APP=$(find "$APP_DIR" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -name "VoiceBoom.app" \
            -print -quit)

          test -n "$APP"
          test -d "$APP/Contents"
          test -f "$APP/Contents/Info.plist"
          test -d "$APP/Contents/MacOS"

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "=== arm64 app ==="
          echo "$APP"

          find "$APP" -maxdepth 3 -print

      - name: Validate executable
        shell: bash
        run: |
          set -euo pipefail

          EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP/Contents/Info.plist")

          test -n "$EXECUTABLE"
          test -f "$APP/Contents/MacOS/$EXECUTABLE"

          echo "Executable: $EXECUTABLE"
          file "$APP/Contents/MacOS/$EXECUTABLE"
          lipo -info "$APP/Contents/MacOS/$EXECUTABLE" || true

      - name: Package app bundle
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-intermediate

          APP_PARENT="$(dirname "$APP")"
          APP_NAME="$(basename "$APP")"

          tar \
            -C "$APP_PARENT" \
            -czf \
            "release-intermediate/VoiceBoom-macos-arm64-appbundle.tar.gz" \
            "$APP_NAME"

          tar -tzf \
            "release-intermediate/VoiceBoom-macos-arm64-appbundle.tar.gz" \
            | head -40

      - name: Upload macOS arm64 app bundle
        uses: actions/upload-artifact@v4
        with:
          name: VoiceBoom-macos-arm64-appbundle
          path: release-intermediate/VoiceBoom-macos-arm64-appbundle.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------
  # 4. Build macOS x86_64 (native on Intel runner)
  # ------------------------------------------------------------
  build-macos-x64:
    name: Build macOS x86_64
    needs: validate

    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build macOS x86_64
        shell: bash
        run: |
          set -euo pipefail

          bunx tauri build \
            --target x86_64-apple-darwin \
            --bundles app

      - name: Locate and validate app
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="src-tauri/target/x86_64-apple-darwin/release/bundle/macos"

          APP="$APP_DIR/VoiceBoom.app"

          test -d "$APP"
          test -f "$APP/Contents/Info.plist"
          test -d "$APP/Contents/MacOS"

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "=== x86_64 app ==="
          echo "$APP"

          find "$APP" -maxdepth 3 -print

      - name: Validate executable
        shell: bash
        run: |
          set -euo pipefail

          EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP/Contents/Info.plist")

          test -n "$EXECUTABLE"
          test -f "$APP/Contents/MacOS/$EXECUTABLE"

          echo "Executable: $EXECUTABLE"
          file "$APP/Contents/MacOS/$EXECUTABLE"
          lipo -info "$APP/Contents/MacOS/$EXECUTABLE" || true

      - name: Package app bundle
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-intermediate

          tar \
            -C "$(dirname "$APP")" \
            -czf \
            "release-intermediate/VoiceBoom-macos-x64-appbundle.tar.gz" \
            "VoiceBoom.app"

      - name: Upload macOS x86_64 app bundle
        uses: actions/upload-artifact@v4
        with:
          name: VoiceBoom-macos-x64-appbundle
          path: release-intermediate/VoiceBoom-macos-x64-appbundle.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------
  # 5. Merge macOS Universal (lipo + verify + DMG)
  # ------------------------------------------------------------
  merge-macos-universal:
    name: Create macOS Universal
    needs:
      - build-macos-arm64
      - build-macos-x64

    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download arm64 app bundle
        uses: actions/download-artifact@v4
        with:
          name: VoiceBoom-macos-arm64-appbundle
          path: incoming/arm64

      - name: Download x86_64 app bundle
        uses: actions/download-artifact@v4
        with:
          name: VoiceBoom-macos-x64-appbundle
          path: incoming/x86_64

      - name: Inspect downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "=== ARM64 artifact ==="
          find incoming/arm64 -maxdepth 3 -print

          echo "=== X86_64 artifact ==="
          find incoming/x86_64 -maxdepth 3 -print

          test -f \
            incoming/arm64/VoiceBoom-macos-arm64-appbundle.tar.gz

          test -f \
            incoming/x86_64/VoiceBoom-macos-x64-appbundle.tar.gz

      - name: Extract app bundles
        shell: bash
        run: |
          set -euo pipefail

          rm -rf staging
          mkdir -p staging/arm64
          mkdir -p staging/x86_64

          tar -xzf \
            incoming/arm64/VoiceBoom-macos-arm64-appbundle.tar.gz \
            -C staging/arm64

          tar -xzf \
            incoming/x86_64/VoiceBoom-macos-x64-appbundle.tar.gz \
            -C staging/x86_64

          echo "=== ARM64 staging tree ==="
          find staging/arm64 -maxdepth 4 -print

          echo "=== X86_64 staging tree ==="
          find staging/x86_64 -maxdepth 4 -print

          test -d staging/arm64/VoiceBoom.app
          test -d staging/x86_64/VoiceBoom.app

          test -f \
            staging/arm64/VoiceBoom.app/Contents/Info.plist

          test -f \
            staging/x86_64/VoiceBoom.app/Contents/Info.plist
      - name: Merge into Universal bundle
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/merge-macos-universal.sh

          ./scripts/merge-macos-universal.sh \
            staging/arm64/VoiceBoom.app \
            staging/x86_64/VoiceBoom.app \
            universal/VoiceBoom.app

      - name: Clean up intermediate files
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Disk usage before cleanup ==="
          df -h / || true
          du -sh staging incoming universal 2>/dev/null || true

          # Remove staging and incoming to free disk space for DMG creation
          rm -rf staging incoming

          echo "=== Disk usage after cleanup ==="
          df -h / || true
          du -sh universal 2>/dev/null || true

      - name: Resign universal app
        shell: bash
        run: |
          set -euo pipefail

          APP=universal/VoiceBoom.app

          # Ad-hoc resign (required after lipo modifies the binary)
          codesign --force --deep -s - "$APP"

          echo "==> Signature:"
          codesign -dv "$APP" 2>&1 || true

      - name: Package Universal app
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          ditto \
            -c -k \
            --sequesterRsrc \
            --keepParent \
            universal/VoiceBoom.app \
            release/VoiceBoom-macOS-Universal.zip

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          hdiutil create \
            -volname "VoiceBoom" \
            -srcfolder universal/VoiceBoom.app \
            -ov \
            -format UDZO \
            release/VoiceBoom-macOS-Universal.dmg

          ls -lah release

      - name: Upload Universal release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voiceboom-macos-universal
          path: |
            release/VoiceBoom-macOS-Universal.zip
            release/VoiceBoom-macOS-Universal.dmg
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------
  # 6. Publish one atomic Release
  # ------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - build-windows
      - build-macos-arm64
      - build-macos-x64
      - merge-macos-universal

    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-macos-arm64.result == 'success' &&
      needs.build-macos-x64.result == 'success' &&
      needs.merge-macos-universal.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p upload

          find release-assets \
            -type f \
            \( \
              -name "*.msi" -o \
              -name "*Setup.exe" -o \
              -name "*.zip" -o \
              -name "*.dmg" \
            \) \
            -exec cp {} upload/ \;

          ls -lah upload

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          cd upload

          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Ensure release does not already exist as published
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then

            IS_DRAFT=$(gh release view "${GITHUB_REF_NAME}" \
              --json isDraft \
              --jq '.isDraft')

            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "Release already published. Refusing to mutate it."
              exit 1
            fi

          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then

            cat > release-notes.md <<EOF2
          # VoiceBoom ${GITHUB_REF_NAME}

          ## Downloads

          ### Windows
          - VoiceBoom Windows x64 installer (MSI)
          - VoiceBoom Windows x64 installer (NSIS)
          - VoiceBoom Windows x64 Portable ZIP (requires WebView2 Runtime)

          ### macOS
          - VoiceBoom macOS Universal DMG (Apple Silicon + Intel)
          - VoiceBoom macOS Universal App ZIP

          ## System Requirements
          - Windows 10/11 with WebView2 Runtime
          - macOS 12.0+ (Monterey)

          ## Integrity

          Commit: ${GITHUB_SHA}
          EOF2

            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "VoiceBoom ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --verify-tag

          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload \
            "${GITHUB_REF_NAME}" \
            upload/* \
            --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release edit \
            "${GITHUB_REF_NAME}" \
            --draft=false

      - name: Print release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}"
