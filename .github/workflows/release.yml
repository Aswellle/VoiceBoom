name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voiceboom-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "latest"

jobs:

  # ------------------------------------------------------------
  # 1. Validate version/tag
  # ------------------------------------------------------------
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

          VERSION="${TAG#v}"

          PKG_VERSION=$(node -e \
            "console.log(require('./package.json').version)")

          TAURI_VERSION=$(node -e \
            "console.log(require('./src-tauri/tauri.conf.json').version)")

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "package.json version ($PKG_VERSION) != tag version ($VERSION)"
            exit 1
          fi

          if [[ "$TAURI_VERSION" != "$VERSION" ]]; then
            echo "tauri.conf.json version ($TAURI_VERSION) != tag version ($VERSION)"
            exit 1
          fi

      - name: Ensure tag points to current commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          TAG_SHA=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          HEAD_SHA="$GITHUB_SHA"

          if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
            echo "Tag does not point to workflow commit."
            exit 1
          fi

  # ------------------------------------------------------------
  # 2. Build platform binaries
  # ------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }}
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: "msi,nsis"

          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            bundles: "app,dmg"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        shell: bash
        run: |
          set -euo pipefail

          bunx tauri build \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}"

      - name: Verify macOS Universal binary
        if: matrix.name == 'macos-universal'
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find \
            src-tauri/target/universal-apple-darwin/release/bundle/macos \
            -maxdepth 1 \
            -name "*.app" \
            -print -quit)

          BIN="$APP/Contents/MacOS/VoiceBoom"

          test -f "$BIN"

          lipo -info "$BIN"
          file "$BIN"

      - name: Verify Windows binary exists
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            "src-tauri/target/x86_64-pc-windows-msvc/release" `
            -Filter "VoiceBoom.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $exe) {
            throw "VoiceBoom.exe not found"
          }

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-artifacts

          if [[ "${{ matrix.name }}" == "windows-x64" ]]; then

            find \
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi \
              -maxdepth 1 \
              -type f \
              -name "*.msi" \
              -exec cp {} release-artifacts/ \;

            find \
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis \
              -maxdepth 1 \
              -type f \
              -name "*.exe" \
              -exec cp {} release-artifacts/ \;

            # Portable binary; confirm at runtime that WebView2 is available.
            find \
              src-tauri/target/x86_64-pc-windows-msvc/release \
              -maxdepth 1 \
              -type f \
              -name "VoiceBoom.exe" \
              -exec cp {} release-artifacts/VoiceBoom-Windows-x64-Portable.exe \;

            cd release-artifacts
            7z a VoiceBoom-Windows-x64-Portable.zip \
              VoiceBoom-Windows-x64-Portable.exe
            rm VoiceBoom-Windows-x64-Portable.exe
            cd ..

          elif [[ "${{ matrix.name }}" == "macos-universal" ]]; then

            find \
              src-tauri/target/universal-apple-darwin/release/bundle/dmg \
              -maxdepth 1 \
              -type f \
              -name "*.dmg" \
              -exec cp {} release-artifacts/ \;

            APP=$(find \
              src-tauri/target/universal-apple-darwin/release/bundle/macos \
              -maxdepth 1 \
              -name "*.app" \
              -print -quit)

            if [[ -n "$APP" ]]; then
              ditto -c -k --sequesterRsrc --keepParent \
                "$APP" \
                "release-artifacts/VoiceBoom-macOS-Universal.zip"
            fi

          fi

          ls -lah release-artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoiceBoom-${{ matrix.name }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------
  # 3. Publish one atomic Release
  # ------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - build

    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.build.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p upload

          find release-assets \
            -type f \
            \( \
              -name "*.msi" -o \
              -name "*.exe" -o \
              -name "*.dmg" -o \
              -name "*.zip" -o \
              -name "*.json" \
            \) \
            -exec cp {} upload/ \;

          ls -lah upload

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          cd upload

          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Ensure release does not already exist as published
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then

            IS_DRAFT=$(gh release view "${GITHUB_REF_NAME}" \
              --json isDraft \
              --jq '.isDraft')

            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "Release already published. Refusing to mutate it."
              exit 1
            fi

          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then

            cat > release-notes.md <<EOF2
          # VoiceBoom ${GITHUB_REF_NAME}

          ## Downloads

          ### Windows
          - VoiceBoom Windows x64 installer (MSI)
          - VoiceBoom Windows x64 installer (NSIS)
          - VoiceBoom Windows x64 portable

          ### macOS
          - VoiceBoom macOS Universal DMG
          - VoiceBoom macOS Universal App ZIP

          ## Integrity
          See SHA256SUMS.txt.

          Commit: ${GITHUB_SHA}
          EOF2

            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "VoiceBoom ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --verify-tag

          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload \
            "${GITHUB_REF_NAME}" \
            upload/* \
            --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release edit \
            "${GITHUB_REF_NAME}" \
            --draft=false

      - name: Print release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}"
