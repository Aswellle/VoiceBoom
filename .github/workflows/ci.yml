name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: voiceboom-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.2.23"
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------
  # Frontend: typecheck + test
  # ------------------------------------------------------------
  frontend:
    name: Frontend (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run build

      - name: Test
        run: bun run test

  # ------------------------------------------------------------
  # Rust: fmt + clippy + test
  # ------------------------------------------------------------
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Download sherpa-onnx libraries
        run: |
          mkdir -p /tmp/sherpa-onnx
          curl -L -o /tmp/sherpa-onnx/lib.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-linux-x64-shared-lib.tar.bz2
          tar -xjf /tmp/sherpa-onnx/lib.tar.bz2 -C /tmp/sherpa-onnx
          echo "SHERPA_ONNX_LIB_DIR=/tmp/sherpa-onnx" >> $GITHUB_ENV

      - name: Cache sherpa-onnx archive
        uses: actions/cache@v4
        with:
          path: /tmp/sherpa-onnx
          key: sherpa-onnx-1.13.8-linux-x64

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
      - name: Format check
        run: cargo fmt --check --locked
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test
        run: cargo test --locked
        working-directory: src-tauri

  # ------------------------------------------------------------
  # Windows: build + test with sherpa bootstrap
  # ------------------------------------------------------------
  windows:
    name: Windows (build + test)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache sherpa-onnx
        uses: actions/cache@v4
        with:
          path: .cache/sherpa-onnx
          key: windows-sherpa-onnx-1.13.8-x64

      - name: Prepare sherpa-onnx
        shell: pwsh
        run: |
          .\scripts\prepare-sherpa-onnx.ps1 -CacheDir ".cache/sherpa-onnx"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
        restore-keys: |
          windows-cargo-

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test
        run: cargo test --locked
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: Test
        run: cargo test
        working-directory: src-tauri
