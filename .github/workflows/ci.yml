name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: voiceboom-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.2.23"
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------
  # Frontend: typecheck + test
  # ------------------------------------------------------------
  frontend:
    name: Frontend (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run build

      - name: Test
        run: bun run test

  # ------------------------------------------------------------
  # Rust: fmt + clippy + test
  # ------------------------------------------------------------
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev pkg-config \
            libxdo-dev libx11-dev libxtst-dev libxkbcommon-dev
      - name: Cache sherpa-onnx
        uses: actions/cache@v6
        with:
          path: .cache/sherpa-onnx
          key: sherpa-onnx-${{ runner.os }}-1.13.8

      - name: Prepare sherpa-onnx
        run: python3 scripts/fetch-sherpa-archive.py

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Format check
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test
        run: cargo test --locked
        working-directory: src-tauri

      - name: Verify offline build
        run: cargo check --locked --offline
        working-directory: src-tauri
        env:
          VOICEBOOM_OFFLINE: "1"

  # ------------------------------------------------------------
  # Windows: build + test with sherpa bootstrap
  # ------------------------------------------------------------
  windows:
    name: Windows (build + test)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache sherpa-onnx
        uses: actions/cache@v6
        with:
          path: .cache/sherpa-onnx
          key: windows-sherpa-onnx-1.13.8-x64

      - name: Prepare sherpa-onnx
        shell: pwsh
        run: |
          .\scripts\prepare-sherpa-onnx.ps1 -CacheDir ".cache/sherpa-onnx"

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test
        run: cargo test --locked
        working-directory: src-tauri

      - name: Verify offline build
        run: cargo check --locked --offline
        working-directory: src-tauri
        env:
          VOICEBOOM_OFFLINE: "1"
