[package]
name = "voiceboom"
version = "0.1.0"
description = "VoiceBoom AI — Real-time streaming voice input method"
authors = ["VoiceBoom Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "voiceboom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.5", features = ["tray-icon"] }
tauri-plugin-shell = "2.2.0"
tauri-plugin-fs = "2.2.0"
tauri-plugin-global-shortcut = "2.2.0"
tauri-plugin-store = "2.2.0"
tauri-plugin-dialog = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
cpal = "0.16"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
log = { version = "0.4", features = ["std"] }
anyhow = "1.0"
async-trait = "0.1"
futures = "0.3"
http = "1.2"
num_cpus = "1.16"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sherpa-onnx = { version = "1.13", default-features = false, features = ["static"] }
# Text injection crates — vendored to avoid external crate references.
win-text-inject = { path = "vendor/win-text-inject" }
enigo = { path = "vendor/enigo" }

[features]
custom-protocol = ["tauri/custom-protocol"]
